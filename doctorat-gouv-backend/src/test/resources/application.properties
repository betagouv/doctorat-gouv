spring.application.name=doctorat-gouv-backend

# Base H2 embarquée pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Scheduler désactivés en test
fresq.scheduler.enabled=false
albert.scheduler.enabled=false
albert.search.enabled=false
scaleway.scheduler.cron=0 0 0 1 1 ?
adum.scheduler.cron=0 0 0 1 1 ?
adum.scheduler.previous-year.cron=0 0 0 1 1 ?
adum.scheduler.next-year.cron=0 0 0 1 1 ?
amethis.scheduler.cron=0 0 0 1 1 ?
albert.scheduler.cron=0 0 0 1 1 ?
fresq.scheduler.cron=0 0 0 1 1 ?

# Propriétés obligatoires des beans (valeurs bidon)
adum.scheduler.cron=0 0 0 1 1 ?
adum.api.username=test
adum.api.password=test
adum.api.base-url=http://localhost
adum.api.year=2026
amethis.api.url=http://localhost
API_KEY_EXPORT=test-key
brevo.api.key=test-key
brevo.api.url=http://localhost
brevo.sender.email=test@localhost
brevo.sender.name=Test
albert.api.key=test-key
albert.base-url=http://localhost
albert.collection.id=1
albert.collection.name=test
scaleway.api.key=test-key
scaleway.api.url=http://localhost

# Fresq
fresq.api.token-url=http://localhost/token
fresq.api.base-url=http://localhost
fresq.api.client-username=client-test
fresq.api.username=test
fresq.api.password=test

# Flux EURAXESS
euraxess.organisation-id-key=doctorat-gouv-test
euraxess.datasource-key=doctorat-gouv-test
euraxess.contact-email=contact@doctorat.gouv.fr
euraxess.validation-enabled=true
EURAXESS_API_KEY=test-euraxess-key

# JWT (test)
app.jwt.secret=VGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9ySlRXVGVzdGluZ1B1cnBvc2Vz
app.jwt.expiration-ms=86400000

# Chiffrement messages (tests) : AUCUNE clé committée (GitGuardian).
# Surcharge volontaire du placeholder exigé par le profil dev : défaut vide pour ne
# jamais échouer sur la résolution, puis repli éphémère ci-dessous (clé aléatoire
# par démarrage JVM, base H2 jetable). Si MESSAGE_ENCRYPTION_KEY est exportée, elle
# est utilisée telle quelle. Ne jamais recopier ce flag hors src/test/resources.
app.messages.encryption.key=${MESSAGE_ENCRYPTION_KEY:}
app.messages.encryption.allow-ephemeral-key-for-tests=true
app.messages.encryption.migrate-legacy-on-startup=false
