spring.application.name=doctorat-gouv-backend

spring.profiles.active=dev

# Nombre max de chunks retournés par l'API Albert (max autorisé : 100)
albert.search.api-limit=100
# Seuil de score minimal pour les résultats Albert (0.0-1.0)
albert.search.score-threshold=0.3
# Méthode de recherche Albert : semantic, hybrid, keyword
albert.search.method=hybrid
# Nombre de pages offset pour étendre les résultats Albert (1 = pas de pagination, 3 = jusqu'à 300 chunks)
albert.search.offset-pages=1

# Nombre de threads pour l'indexation parallèle dans Albert
albert.indexation.threads=4



